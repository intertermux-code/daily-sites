<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lenscraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="skip-link">
        <a href="#main-content" aria-label="Skip to main content">Skip to content</a>
    </div>

    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html" aria-label="Lenscraft Home">Lenscraft</a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html" aria-current="page">Gallery</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="pricing.html">Pricing</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="gallery-hero">
            <div class="container">
                <h1>Portfolio Gallery</h1>
                <p>Explore our curated collections of editorial wedding photography</p>
            </div>
        </section>

        <section class="gallery-filter">
            <div class="container">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="portraits">Portraits</button>
                    <button class="filter-btn" data-filter="ceremony">Ceremony</button>
                    <button class="filter-btn" data-filter="details">Details</button>
                </div>
            </div>
        </section>

        <section class="gallery-grid-section">
            <div class="container">
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Portraits -->
                    <div class="gallery-item" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80" alt="Intimate couple portrait during golden hour" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1595675024853-0f3ec9098ac7?auto=format&fit=crop&w=800&q=80" alt="Bride and groom sharing a tender moment" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Couple dancing under string lights" width="800" height="600">
                    </div>
                    
                    <!-- Ceremony -->
                    <div class="gallery-item" data-category="ceremony">
                        <img src="https://picsum.photos/seed/lenscraft-2b28a9b3c4e8/1600/900?auto=format&fit=crop&w=800&q=80" alt="Bride walking down the aisle" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80" alt="Wedding ceremony with floral arch" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1595675024853-0f3ec9098ac7?auto=format&fit=crop&w=800&q=80" alt="Exchange of vows moment" width="800" height="600">
                    </div>
                    
                    <!-- Details -->
                    <div class="gallery-item" data-category="details">
                        <img src="https://picsum.photos/seed/lenscraft-2b28a9b3c4e8/1600/900?auto=format&fit=crop&w=800&q=80" alt="Detailed shot of wedding rings" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="details">
                        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Close-up of floral arrangements" width="800" height="600">
                    </div>
                    <div class="gallery-item" data-category="details">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80" alt="Table setting with elegant details" width="800" height="600">
                    </div>
                </div>
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
            <button class="lightbox-nav prev" aria-label="Previous image">&#8249;</button>
            <button class="lightbox-nav next" aria-label="Next image">&#8250;</button>
            <img class="lightbox-img" src="" alt="">
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Lenscraft. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram">Instagram</a>
                <a href="#" aria-label="Facebook">Facebook</a>
                <a href="#" aria-label="Pinterest">Pinterest</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>

</html>
