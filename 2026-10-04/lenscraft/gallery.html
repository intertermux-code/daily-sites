<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lenscraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="skip-container">
        <a href="#main-content" class="skip-link">Skip to content</a>
    </div>

    <header class="site-header">
        <nav class="navigation" aria-label="Main">
            <a href="index.html" class="logo" aria-label="Lenscraft Home">LENSCRAFT</a>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" aria-current="page">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <!-- Gallery Header -->
        <section class="gallery-header full-bleed-chapter">
            <div class="container">
                <h1 class="page-title">WEDDING GALLERY</h1>
                <p class="page-subtitle">A collection of moments captured in time</p>
            </div>
        </section>

        <!-- Filter Controls -->
        <section class="gallery-filter full-bleed-chapter">
            <div class="container">
                <div class="filter-controls">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="portraits">Portraits</button>
                    <button class="filter-btn" data-filter="ceremony">Ceremony</button>
                    <button class="filter-btn" data-filter="details">Details</button>
                </div>
            </div>
        </section>

        <!-- Gallery Grid -->
        <section class="gallery-grid-section full-bleed-chapter">
            <div class="container">
                <div class="gallery-grid">
                    <!-- Portraits -->
                    <div class="gallery-item portraits">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                             alt="Intimate couple portrait during golden hour"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item portraits">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                             alt="Engaged couple laughing together"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item portraits">
                        <img src="https://images.unsplash.com/photo-1595675024853-0f3ec9098ac7?auto=format&fit=crop&w=1600&q=80"
                             alt="Bride and groom sharing a quiet moment"
                             width="800" height="600">
                    </div>
                    
                    <!-- Ceremony -->
                    <div class="gallery-item ceremony">
                        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=80"
                             alt="Wedding ceremony with golden hour lighting"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item ceremony">
                        <img src="https://picsum.photos/seed/lenscraft-7a5b1dbce206/1600/900?auto=format&fit=crop&w=1600&q=80"
                             alt="Bride walking down the aisle"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item ceremony">
                        <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1600&q=80"
                             alt="Groom waiting at altar"
                             width="800" height="600">
                    </div>
                    
                    <!-- Details -->
                    <div class="gallery-item details">
                        <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=1600&q=80"
                             alt="Wedding ring with flowers in background"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item details">
                        <img src="https://picsum.photos/seed/lenscraft-aa3abc96eae9/1600/900?auto=format&fit=crop&w=1600&q=80"
                             alt="Detailed shot of wedding bouquet"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item details">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                             alt="Wedding table setting with elegant details"
                             width="800" height="600">
                    </div>
                    
                    <!-- Additional items for variety -->
                    <div class="gallery-item portraits">
                        <img src="https://images.unsplash.com/photo-1595675024853-0f3ec9098ac7?auto=format&fit=crop&w=1600&q=80"
                             alt="Bride getting ready with bridesmaids"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item ceremony">
                        <img src="https://picsum.photos/seed/lenscraft-7a5b1dbce206/1600/900?auto=format&fit=crop&w=1600&q=80"
                             alt="Reception celebration with guests dancing"
                             width="800" height="600">
                    </div>
                    <div class="gallery-item details">
                        <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=1600&q=80"
                             alt="Wedding cake cutting ceremony"
                             width="800" height="600">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <img class="lightbox-image" src="" alt="">
        <button class="lightbox-nav prev" aria-label="Previous image">&#8249;</button>
        <button class="lightbox-nav next" aria-label="Next image">&#8250;</button>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Lenscraft. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram">IG</a>
                <a href="#" aria-label="Facebook">FB</a>
                <a href="#" aria-label="Pinterest">PIN</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>

</html>
