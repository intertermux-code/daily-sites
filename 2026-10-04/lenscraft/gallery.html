<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lenscraft Wedding Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header class="site-header">
        <div class="container">
            <h1 class="logo"><a href="index.html" aria-label="Lenscraft Home">Lenscraft</a></h1>
            <nav class="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html" aria-current="page">Gallery</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="pricing.html">Pricing</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="gallery-hero">
            <div class="container">
                <h1>Photography Gallery</h1>
                <p>Explore our collection of wedding photography, organized by category</p>
            </div>
        </section>

        <section class="gallery-filters">
            <div class="container">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="portraits">Portraits</button>
                    <button class="filter-btn" data-filter="ceremony">Ceremony</button>
                    <button class="filter-btn" data-filter="details">Details</button>
                </div>
            </div>
        </section>

        <section class="gallery-grid-section">
            <div class="container">
                <div class="gallery-grid">
                    <!-- Portraits -->
                    <div class="gallery-item" data-category="portraits">
                        <figure>
                            <img src="https://picsum.photos/seed/lenscraft-2fed0a600bea/1600/900?auto=format&fit=crop&w=1600&q=80"
                                 alt="Bride and groom sharing intimate portrait during wedding"
                                 width="800" height="600">
                            <figcaption>Intimate Portrait</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="portraits">
                        <figure>
                            <img src="https://picsum.photos/seed/lenscraft-2707ac291cfc/1600/900?auto=format&fit=crop&w=1600&q=80"
                                 alt="Couple laughing together during engagement session"
                                 width="800" height="600">
                            <figcaption>Engagement Joy</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="portraits">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                                 alt="Bride getting ready with her bridesmaids"
                                 width="800" height="600">
                            <figcaption>Bridal Preparation</figcaption>
                        </figure>
                    </div>
                    
                    <!-- Ceremony -->
                    <div class="gallery-item" data-category="ceremony">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                                 alt="Outdoor wedding ceremony with floral archway"
                                 width="800" height="600">
                            <figcaption>Floral Arch Ceremony</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="ceremony">
                        <figure>
                            <img src="https://picsum.photos/seed/lenscraft-2707ac291cfc/1600/900?auto=format&fit=crop&w=1600&q=80"
                                 alt="Groom waiting at altar during wedding ceremony"
                                 width="800" height="600">
                            <figcaption>Altar Anticipation</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="ceremony">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                                 alt="Vows being exchanged during indoor wedding ceremony"
                                 width="800" height="600">
                            <figcaption>Vow Exchange</figcaption>
                        </figure>
                    </div>
                    
                    <!-- Details -->
                    <div class="gallery-item" data-category="details">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80"
                                 alt="Close-up of wedding rings on flower petals"
                                 width="800" height="600">
                            <figcaption>Rings & Petals</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="details">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                                 alt="Detailed wedding invitation suite with calligraphy"
                                 width="800" height="600">
                            <figcaption>Invitation Suite</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="details">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                                 alt="Decorated wedding cake with fresh flowers"
                                 width="800" height="600">
                            <figcaption>Cake & Flowers</figcaption>
                        </figure>
                    </div>
                    
                    <!-- Mixed -->
                    <div class="gallery-item" data-category="portraits">
                        <figure>
                            <img src="https://picsum.photos/seed/lenscraft-2707ac291cfc/1600/900?auto=format&fit=crop&w=1600&q=80"
                                 alt="Family group photo during wedding celebration"
                                 width="800" height="600">
                            <figcaption>Family Gathering</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="ceremony">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80"
                                 alt="Bride walking down aisle with father"
                                 width="800" height="600">
                            <figcaption>Aisle Walk</figcaption>
                        </figure>
                    </div>
                    <div class="gallery-item" data-category="details">
                        <figure>
                            <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                                 alt="Wedding table setting with elegant centerpieces"
                                 width="800" height="600">
                            <figcaption>Table Setting</figcaption>
                        </figure>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <div class="lightbox-content">
                <span class="close-lightbox" aria-label="Close lightbox">&times;</span>
                <img class="lightbox-img" src="" alt="">
                <div class="lightbox-caption"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Lenscraft Photography. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram">IG</a>
                <a href="#" aria-label="Facebook">FB</a>
                <a href="#" aria-label="Pinterest">P</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>
<a href="https://intertermux-code.github.io/daily-sites/" target="_blank" rel="noopener" translate="no" style="position:fixed;bottom:14px;right:14px;z-index:99999;font:12px/1.4 system-ui,sans-serif;background:rgba(17,17,17,.85);color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.25)">Built by Clawdyy · Get a site like this →</a></body>
</html>
