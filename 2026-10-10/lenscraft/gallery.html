<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lenscraft</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="skip-container">
        <a href="#main-content" class="skip-link">Skip to content</a>
    </div>

    <header class="site-header">
        <nav class="navigation">
            <div class="nav-brand">
                <a href="index.html" aria-label="Lenscraft Home">Lenscraft</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" aria-current="page">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="menu-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main id="main-content">
        <section class="gallery-hero">
            <div class="container">
                <h1>Photography Gallery</h1>
                <p>Explore our collection of timeless wedding moments</p>
            </div>
        </section>

        <section class="gallery-filters">
            <div class="container">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="portraits">Portraits</button>
                    <button class="filter-btn" data-filter="ceremony">Ceremony</button>
                    <button class="filter-btn" data-filter="details">Details</button>
                </div>
            </div>
        </section>

        <section class="gallery-content">
            <div class="container">
                <div class="mosaic-grid" id="gallery-grid">
                    <!-- Portraits -->
                    <div class="mosaic-item large filter-portraits" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                             alt="Bride and groom embracing during ceremony"
                             width="600" height="800">
                    </div>
                    <div class="mosaic-item medium filter-portraits" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1200&q=80"
                             alt="Bridal party portraits"
                             width="500" height="600">
                    </div>
                    <div class="mosaic-item small filter-portraits" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=800&q=80"
                             alt="Intimate couple portrait"
                             width="400" height="400">
                    </div>
                    
                    <!-- Ceremony -->
                    <div class="mosaic-item large filter-ceremony" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1600&q=80"
                             alt="Ceremony aisle with flower petals"
                             width="600" height="800">
                    </div>
                    <div class="mosaic-item medium filter-ceremony" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80"
                             alt="Exchange of vows"
                             width="500" height="600">
                    </div>
                    <div class="mosaic-item small filter-ceremony" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80"
                             alt="Ring bearer with flowers"
                             width="400" height="400">
                    </div>
                    
                    <!-- Details -->
                    <div class="mosaic-item medium filter-details" data-category="details">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80"
                             alt="Wedding ring detail"
                             width="500" height="600">
                    </div>
                    <div class="mosaic-item small filter-details" data-category="details">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80"
                             alt="Flower bouquet close-up"
                             width="400" height="400">
                    </div>
                    <div class="mosaic-item large filter-details" data-category="details">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80"
                             alt="Table setting with elegant decor"
                             width="600" height="800">
                    </div>
                    
                    <!-- Mixed -->
                    <div class="mosaic-item small filter-portraits" data-category="portraits">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80"
                             alt="Groom adjusting tie"
                             width="400" height="400">
                    </div>
                    <div class="mosaic-item medium filter-ceremony" data-category="ceremony">
                        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80"
                             alt="First dance"
                             width="500" height="600">
                    </div>
                    <div class="mosaic-item small filter-details" data-category="details">
                        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80"
                             alt="Cake cutting moment"
                             width="400" height="400">
                    </div>
                </div>
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <div class="lightbox-content">
                <span class="lightbox-close">&times;</span>
                <img class="lightbox-img" id="lightbox-img" src="" alt="">
                <div class="lightbox-caption" id="lightbox-caption"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Lenscraft. Capturing life’s most precious moments.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram">IG</a>
                <a href="#" aria-label="Facebook">FB</a>
                <a href="#" aria-label="Twitter">TW</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>

</html>
